<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPS杀</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <h1>FPS杀</h1>
        <span id="version" class="muted"></span>
        <nav>
          <button id="tab-battle-btn" class="tab-btn active">对战</button>
          <button id="tab-gallery-btn" class="tab-btn">图鉴</button>
          <button id="net-btn" class="tab-btn">联机</button>
        </nav>
        <div id="meta" class="muted"></div>
      </header>

      <main id="tab-battle">
        <section id="net-panel" hidden>
          <div id="net-form">
            <label class="muted">服务器 <input id="net-url" placeholder="留空=本页同源；dev 填 ws://127.0.0.1:7000/ws" /></label>
            <label class="muted">昵称 <input id="net-name" maxlength="24" placeholder="玩家" /></label>
            <button id="net-connect">连接</button>
          </div>
          <div id="net-room" hidden>
            <span id="net-info" class="muted"></span>
            <div id="net-seats" class="muted"></div>
            <div id="net-config-row" hidden>
              <span class="muted">人数</span>
              <button id="net-cap-minus" class="ghost">−</button>
              <span id="net-cap-value"></span>
              <button id="net-cap-plus" class="ghost">＋</button>
            </div>
            <button id="net-sit">落座</button>
            <button id="net-start">开始对局</button>
            <button id="net-reset" class="ghost">重置房间</button>
            <button id="net-disconnect" class="ghost">断开</button>
            <span id="net-status" class="muted"></span>
          </div>
        </section>
        <section id="players"></section>
        <section id="tablebar">
          <div id="piles" class="muted"></div>
          <div id="actions">
            <span id="skill-btns"></span>
            <button id="btn-bot">Bot 代打本回合</button>
            <button id="btn-end">结束回合</button>
            <button id="btn-new">新对局</button>
            <label class="muted">seed <input id="seed-input" type="number" value="42" min="1" max="999999" /></label>
          </div>
        </section>
        <section id="hand-wrap">
          <h2 id="hand-title"></h2>
          <div id="hand"></div>
          <div id="hint" class="muted"></div>
        </section>
        <section id="log-wrap">
          <h2>对局日志</h2>
          <div id="log"></div>
        </section>
      </main>

      <main id="tab-gallery" hidden></main>

      <div id="overlay" hidden></div>
      <div id="toast" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
